services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fineprint-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fineprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fineprint}
      POSTGRES_DB: ${POSTGRES_DB:-fineprint}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fineprint}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
